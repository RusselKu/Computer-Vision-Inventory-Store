name: CI Pipeline - Backend & Docker Validation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Backend Test Suite & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://klsqlozvtgqsruwfrkss.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtsc3Fsb3p2dGdxc3J1d2Zya3NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTk2NjUsImV4cCI6MjEwNDEzNTY2NX0.llyR5BzDC6QT8OKhXXWkRZn9lwN5GB96oH6fRtQLYYk' }}
        run: |
          pytest backend/tests/test_api.py -v

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: pos-core-api:latest
