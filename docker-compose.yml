services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_core_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - pos-network

  redis:
    image: redis:7-alpine
    container_name: pos_redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge
